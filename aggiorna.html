<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A4C9E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E2F5C" media="(prefers-color-scheme: dark)">
<title>Aggiorna i tuoi dati</title>
<!--
  Pagina PUBBLICA per i volontari (fase 2 "Aggiornamento dati").
  Autonoma: CSS e JS inline, nessuna dipendenza dall'area riservata, nessun
  service worker. Parla solo con la Edge Function agg-pub, che verifica a
  ogni chiamata token del link + data di nascita. Quello che il volontario
  invia diventa una PROPOSTA: i dati reali cambiano solo quando un master
  la approva dall'area riservata.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══ DESIGN SYSTEM (fonte: riferimento-grafica.html, come area-riservata.html) ══
   Token, Inter, raggi, pulsanti gialli, chip, card, campi e pillole dell'app.
   Mobile first: colonna unica, barra azioni fissa in basso. */
:root{--bg:#F3F6FB;--surface:#FFFFFF;--line:#DCE5F2;--line2:#C5D3E8;--fg:#072F63;--muted:#44597D;--head:#0A4C9E;--head-fg:#FFFFFF;--head-muted:#C9DBF5;--accent:#0A4C9E;--accent-bg:#0A4C9E;--accent-fg:#FFFFFF;--soft:#DCE9FA;--yellow:#FFC20E;--yellow-soft:#FFF1BF;--on-yellow:#072F63;--grey-bg:#E7EAF0;--red:#B42318;--red-soft:#FDE4E1;--shadow:0 12px 40px rgba(7,47,99,.22);--font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --paper:#FFFFFF;--paper-line:#C5D3E8;--paper-muted:#44597D;--photo-bg:#000000;--safe-b:env(safe-area-inset-bottom,0px);--col:640px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1424;--surface:#121E33;--line:#243553;--line2:#33466B;--fg:#E6EEFB;--muted:#9DB0CF;--head:#0E2F5C;--head-fg:#FFFFFF;--head-muted:#B5C9EA;--accent:#8DBBF7;--accent-bg:#2F6FC4;--accent-fg:#FFFFFF;--soft:#1B2F52;--yellow-soft:#3A3012;--grey-bg:#26324A;--red:#FF8A80;--red-soft:#3B1A1A;--shadow:0 12px 40px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1424;--surface:#121E33;--line:#243553;--line2:#33466B;--fg:#E6EEFB;--muted:#9DB0CF;--head:#0E2F5C;--head-fg:#FFFFFF;--head-muted:#B5C9EA;--accent:#8DBBF7;--accent-bg:#2F6FC4;--accent-fg:#FFFFFF;--soft:#1B2F52;--yellow-soft:#3A3012;--grey-bg:#26324A;--red:#FF8A80;--red-soft:#3B1A1A;--shadow:0 12px 40px rgba(0,0,0,.55);color-scheme:dark}

/* ── base ── */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:var(--col);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hidden{display:none!important}
.center{text-align:center}

/* ── barra alta ── */
.top{background:var(--head);color:var(--head-fg);padding-top:env(safe-area-inset-top,0px)}
.topin{height:68px;display:flex;align-items:center;gap:12px}
.brand-logo{width:40px;height:40px;border-radius:12px;background:var(--paper);object-fit:contain;padding:2px;flex-shrink:0}
.top-t{font-size:16px;font-weight:800;line-height:1.15}
.top-s{font-size:12px;color:var(--head-muted)}

/* ── avanzamento ── */
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px}
.prog-bar{display:block;width:100%;height:12px;border:0;border-radius:999px;background:var(--grey-bg);overflow:hidden;-webkit-appearance:none;appearance:none}
.prog-bar::-webkit-progress-bar{background:var(--grey-bg);border-radius:999px}
.prog-bar::-webkit-progress-value{background:var(--yellow);border-radius:999px}
.prog-bar::-moz-progress-bar{background:var(--yellow);border-radius:999px}
.prog-l{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:700;color:var(--fg)}
#progStep{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--yellow-soft);color:var(--fg)}

/* ── pagina ── */
main{padding-top:24px;padding-bottom:calc(112px + var(--safe-b))}
h1{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1;text-wrap:balance;margin:4px 0 10px}
h2{font-size:18px;font-weight:800;margin:26px 0 10px}
p{margin:0 0 12px;color:var(--muted)}
p strong{color:var(--fg)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.load{margin-top:40px}
.blu{color:var(--accent);font-weight:700}
.amb{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--yellow-soft);color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.big-ico{font-size:52px;margin:20px 0 6px}
.link-btn{background:none;border:0;color:var(--accent);font-size:15px;font-weight:700;padding:10px 0;text-decoration:underline}

/* ── campi ── */
.f{margin-bottom:14px}
.f:last-child{margin-bottom:0}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input,.f select,.sel{width:100%;height:46px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--fg);font-size:16px;-webkit-appearance:none;appearance:none}
.f select,.sel{padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.f input:focus,.f select:focus,.sel:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.f.changed input{border-color:var(--accent);background:var(--soft)}
.f .was{font-size:12px;font-weight:600;color:var(--accent);margin-top:6px}
.f .hint{font-size:12px;color:var(--muted);margin-top:6px}
.f .warn{font-size:13px;font-weight:600;color:var(--fg);background:var(--yellow-soft);border-radius:12px;padding:8px 12px;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px}
.dob{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:12px}
.dob .f{margin:0}
.dob input{height:56px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

/* ── pulsanti: giallo = azione principale, bordo = secondaria ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--yellow);background:var(--yellow);color:var(--on-yellow);font-weight:800;font-size:15px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.sec{background:var(--surface);border-color:var(--line2);color:var(--accent);font-weight:700}
.btn.sec:hover{border-color:var(--accent);filter:none}
.btn.danger{background:var(--surface);border-color:var(--line2);color:var(--red);font-weight:700}
.btn.danger:hover{border-color:var(--red);filter:none}
.btn.small{width:auto;height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.cat-add{margin-bottom:8px}
.duo{display:flex;gap:10px}
.duo .btn{flex:1;min-width:0}
#firmaBox .duo{margin-top:10px}

/* ── barra azioni in basso ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + var(--safe-b))}
.nav-in{display:flex;gap:10px}
.nav-in .btn.sec{flex:0 0 34%}

/* ── messaggi ── */
.msg{padding:12px 16px;border-radius:16px;font-size:14px;font-weight:600;margin-bottom:14px}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.ok{background:var(--soft);color:var(--fg)}
.msg.info{background:var(--soft);color:var(--accent)}
.msg.warn{background:var(--yellow-soft);color:var(--fg)}
#stato{margin-top:14px}

/* ── taglie e DPI: capi come card, Ce l'ho / Non ce l'ho come chip ── */
.cat-h{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px}
.capo{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.capo-n{font-weight:700;font-size:15px;margin-bottom:10px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:600;font-size:14px;white-space:nowrap}
.yn button:hover{border-color:var(--accent)}
.yn button.on-si{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--accent-fg)}
.yn button.on-no{background:var(--grey-bg);border-color:var(--grey-bg);color:var(--fg)}
.capo .sel{margin-top:10px}

/* ── foto tessera ── */
.foto-ok{display:flex;gap:14px;align-items:center}
.foto-prev{width:98px;height:118px;border-radius:14px;object-fit:cover;background:var(--bg);border:1px solid var(--line);display:block;flex-shrink:0}
#cropArea{margin-top:14px}
.crop-tip{font-size:14px;color:var(--muted);text-align:center}
.crop-wrap{position:relative;width:245px;height:295px;margin:12px auto;border-radius:14px;overflow:hidden;background:var(--photo-bg);touch-action:none}
.crop-wrap canvas{width:100%;height:100%;display:block;cursor:grab}
.crop-guide{position:absolute;inset:0;pointer-events:none}
.crop-guide svg{width:100%;height:100%}
.crop-oval{stroke:var(--paper);stroke-opacity:.8}
.zoom{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.zoom input{flex:1;accent-color:var(--accent-bg);height:32px}
#cropInfo{margin-bottom:10px}
.mt{margin-top:6px}

/* ── documenti ── */
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:10px}
.slot-i{flex:1;min-width:0}
.slot-t{font-weight:700;font-size:15px}
.slot-m{font-size:13px;color:var(--muted);word-break:break-word}
.slot-m.ok{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--accent);margin-top:2px}
.thumb{width:54px;height:54px;border-radius:14px;object-fit:cover;background:var(--yellow-soft);border:0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.slot-b{display:flex;gap:8px;width:100%}
.slot-b .btn{flex:1;min-width:0;height:40px;padding:0 10px;font-size:14px;border-radius:12px}

/* ── riepilogo, privacy, firma ── */
.sum{padding-left:18px;margin:0}
.sum ul{padding-left:16px;margin:4px 0 8px}
.sum li{margin-bottom:6px;color:var(--fg)}
.sum .k{color:var(--muted)}
details.priv{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 18px;margin-bottom:12px;font-size:14px;color:var(--muted)}
details.priv summary{font-weight:700;color:var(--accent);cursor:pointer}
details.priv p{margin:10px 0 0}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;font-weight:600;padding:14px 16px;background:var(--surface);border:1px solid var(--line2);border-radius:20px;cursor:pointer}
.chk:has(input:checked){border-color:var(--accent);background:var(--soft)}
.chk input{width:22px;height:22px;flex-shrink:0;accent-color:var(--accent-bg);margin:0}
/* Riquadro firma: sempre "foglio bianco" con inchiostro scuro, anche in tema scuro */
.firma-wrap{position:relative;background:var(--paper);border:2px dashed var(--paper-line);border-radius:20px;overflow:hidden;touch-action:none;margin-top:10px}
.firma-wrap canvas{display:block;width:100%;aspect-ratio:3 / 1;cursor:crosshair;touch-action:none}
.firma-linea{position:absolute;left:6%;right:6%;bottom:22%;border-bottom:1px solid var(--paper-line);pointer-events:none}
.firma-ph{position:absolute;left:0;right:0;top:38%;text-align:center;color:var(--paper-muted);font-size:14px;font-weight:600;pointer-events:none}
.firma-img{display:block;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:20px;margin-top:10px}
.firma-img+.slot-m{margin-top:8px}
#firmaBox .btn.small{margin-top:8px}

/* ── schermi più larghi ── */
@media (min-width:600px){
 h1{font-size:32px}
 main{padding-top:32px}
 .nav-in .btn.sec{flex:0 0 200px}
}
@media (max-width:380px){.dob{gap:8px}.dob input{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap topin">
    <img class="brand-logo" src="images/logo-sezione.png" alt="">
    <div><div class="top-t">Protezione Civile ANA</div><div class="top-s">Casale Monferrato — aggiornamento dati</div></div>
  </div>
</header>
<div class="prog hidden" id="prog">
  <div class="wrap">
    <progress class="prog-bar" id="progFill" max="100" value="0"></progress>
    <div class="prog-l"><span id="progStep"></span><span id="progName"></span></div>
  </div>
</div>
<main class="wrap" id="app"><p class="center load">Caricamento…</p></main>
<div class="nav hidden" id="nav"><div class="wrap nav-in" id="navIn"></div></div>

<script>
'use strict';

const PUB_URL = 'https://pggtmyarpuztfewqgwyc.supabase.co/functions/v1/agg-pub';

// Testo dell'informativa privacy: titolare e finalità li stabilisce la Sezione.
// Sostituire questo testo provvisorio con quello ufficiale.
const INFORMATIVA_HTML = `
  <p><strong>Titolare del trattamento:</strong> Associazione Nazionale Alpini — Sezione di Casale Monferrato, Unità di Protezione Civile. <em>[da completare a cura della Sezione: indirizzo e contatti del titolare / referente privacy]</em></p>
  <p><strong>Finalità:</strong> aggiornamento dell'anagrafica dei volontari, gestione di dotazioni e DPI (taglie), rilascio del tesserino e gestione dei documenti necessari all'attività di volontariato di protezione civile. <em>[da confermare a cura della Sezione]</em></p>
  <p>I dati sono trattati solo dal personale incaricato della Sezione, conservati in archivi protetti e non sono diffusi. Quanto inviato con questo modulo viene controllato da un incaricato prima di sostituire i dati già presenti.</p>
  <p>Puoi chiedere in ogni momento l'accesso, la rettifica o la cancellazione dei tuoi dati e gli altri diritti previsti dagli artt. 15–22 del Regolamento UE 2016/679, rivolgendoti alla Sezione.</p>`;

const CAMPI = [
  // [chiave, etichetta, tipo input, attributi extra]
  ['cognome', 'Cognome', 'text', 'autocomplete="family-name"'],
  ['nome', 'Nome', 'text', 'autocomplete="given-name"'],
  ['codice_fiscale', 'Codice fiscale', 'text', 'autocapitalize="characters" maxlength="16" spellcheck="false"'],
  ['data_nascita', 'Data di nascita', 'date', ''],
  ['luogo_nascita', 'Comune di nascita', 'text', ''],
  ['provincia_nascita', 'Provincia di nascita (sigla)', 'text', 'maxlength="2" autocapitalize="characters"'],
  ['indirizzo', 'Via / Piazza', 'text', 'autocomplete="address-line1"'],
  ['civico', 'Numero civico', 'text', ''],
  ['cap', 'CAP', 'text', 'inputmode="numeric" maxlength="5" autocomplete="postal-code"'],
  ['citta', 'Comune di residenza', 'text', 'autocomplete="address-level2"'],
  ['provincia', 'Provincia (sigla)', 'text', 'maxlength="2" autocapitalize="characters"'],
  ['telefono', 'Telefono / cellulare', 'tel', 'autocomplete="tel"'],
  ['email', 'Email', 'email', 'autocomplete="email" autocapitalize="off"'],
  ['titolo_studio', 'Titolo di studio', 'text', ''],
  ['professione', 'Professione', 'text', ''],
  ['patenti', 'Patenti di guida (es. B, C)', 'text', 'autocapitalize="characters"'],
  ['tessera_ana', 'Numero tessera ANA', 'text', ''],
];
const LABEL = Object.fromEntries(CAMPI.map(c => [c[0], c[1]]));

const TAGLIE = {
  ABITO:  ['XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL', '5XL'],
  SCARPA: Array.from({ length: 14 }, (_, i) => String(35 + i)),
  GUANTO: ['S', 'M', 'L', 'XL', 'XXL'],
  UNICA:  [],
};
const ORDINE_CATEGORIE = ['GENERICO', 'MOTOSEGHISTA', 'CUCINA', 'REGIONE PIEMONTE', 'CAPOSQUADRA'];

const DOC_SEZIONI = [
  { tipo: 'CARTA_IDENTITA', titolo: '🪪 Carta d\'identità' },
  { tipo: 'CODICE_FISCALE', titolo: '💳 Codice fiscale (tessera sanitaria)' },
  { tipo: 'PATENTE', titolo: '🚗 Patente di guida', soloSePatente: true },
];
const LATI = ['FRONTE', 'RETRO'];
const ACCEPT_DOC = 'image/jpeg,image/png,application/pdf';
const MAX_BYTES = 10 * 1024 * 1024;

const PASSI = [
  { id: 'anagrafica', nome: 'Dati personali' },
  { id: 'dpi', nome: 'Taglie e DPI' },
  { id: 'foto', nome: 'Foto tessera' },
  { id: 'documenti', nome: 'Documenti' },
  { id: 'riepilogo', nome: 'Riepilogo e invio' },
];

// ---------------- stato ----------------
const S = {
  token: null, dob: null, info: null,
  passo: 'verifica',
  orig: {}, dati: {},
  dpi: {},                 // dpi_id → { ha: true|false|null, taglia }
  catAperte: new Set(),
  esistenti: [],           // documenti già inviati in attesa (proposta aperta)
  foto: null,              // { blob, url } nuova foto pronta
  slot: {},                // 'TIPO|LATO' → { file, url }
  attestati: [],           // [{ key, tipo, descrizione, scadenza, file, url }]
  caricati: new Set(),     // chiavi già caricate nell'invio in corso (per i "riprova")
  privacy: false,
  firma: null,             // { blob, url } firma tracciata nel riquadro
  inviando: false,
};

const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtData(iso) { if (!iso) return ''; const s = String(iso).slice(0, 10).split('-'); return s.length === 3 ? s[2] + '/' + s[1] + '/' + s[0] : iso; }
function fmtDataOra(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('it-IT') + ' alle ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }); }

// ---------------- chiamate ----------------
class ErroreLink extends Error {}
async function chiama(action, extra) {
  let res, data;
  try {
    res = await fetch(PUB_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ t: S.token, data_nascita: S.dob, action }, extra || {})),
    });
    data = await res.json();
  } catch (e) { throw new Error('Connessione non riuscita. Controlla la rete e riprova.'); }
  if (res.status === 404 || res.status === 403 && data.bloccato) throw new ErroreLink(data.error || 'Link non valido o scaduto.');
  if (!res.ok || !data.ok) { const e = new Error(data.error || 'Errore, riprova.'); e.dati = data; throw e; }
  return data;
}
async function carica(tipo, file, nomeFile, descrizione, scadenza) {
  const fd = new FormData();
  fd.append('t', S.token); fd.append('data_nascita', S.dob); fd.append('action', 'upload');
  fd.append('tipo', tipo);
  if (descrizione) fd.append('descrizione', descrizione);
  if (scadenza) fd.append('scadenza', scadenza);
  fd.append('file', file, nomeFile || 'file');
  let res, data;
  try { res = await fetch(PUB_URL, { method: 'POST', body: fd }); data = await res.json(); }
  catch (e) { throw new Error('Connessione non riuscita durante il caricamento dei file.'); }
  if (res.status === 404) throw new ErroreLink(data.error || 'Link non valido o scaduto.');
  if (!res.ok || !data.ok) throw new Error(data.error || 'Caricamento non riuscito.');
  return data.documento;
}

// ---------------- avvio ----------------
(function avvio() {
  const qs = new URLSearchParams(location.search);
  let t = qs.get('t');
  try {

  S.token = t;

})();

async function verifica() {
  const g = $('dG').value.trim(), m = $('dM').value.trim(), a = $('dA').value.trim();
  if (!/^\d{1,2}$/.test(g) || !/^\d{1,2}$/.test(m) || !/^\d{4}$/.test(a)) return renderVerifica('Scrivi giorno, mese e anno (es. 07 03 1975).');
  const iso = a + '-' + m.padStart(2, '0') + '-' + g.padStart(2, '0');
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d) || d.getDate() !== Number(g) || d.getMonth() + 1 !== Number(m)) return renderVerifica('Data non valida.');
  const btn = $('btnVerifica'); btn.disabled = true; btn.textContent = 'Verifica…';
  S.dob = iso;
  try {
    const info = await chiama('apri');
    inizializza(info);
    vai('anagrafica');
  } catch (e) {
    S.dob = null;
    if (e instanceof ErroreLink) return schermataErroreLink(e.message);

    if (e.dati && e.dati.tentativi_rimasti != null) msg += ' Tentativi rimasti: ' + e.dati.tentativi_rimasti + '.';

  if (k === 'codice_fiscale' && norm(S.dati[k]) && !cfValido(S.dati[k])) html += '<div class="warn">⚠️ Il codice fiscale non sembra corretto: controllalo.</div>';
  if (k === 'cap' && norm(S.dati[k]) && !/^\d{5}$/.test(norm(S.dati[k]))) html += '<div class="warn">⚠️ Il CAP ha 5 cifre.</div>';
  if (k === 'email' && norm(S.dati[k]) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(norm(S.dati[k]))) html += '<div class="warn">⚠️ Controlla l\'indirizzo email.</div>';

// Controllo formale del codice fiscale (carattere di controllo), solo avviso.
function cfValido(cf) {
  cf = String(cf).toUpperCase().replace(/\s/g, '');
  if (!/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(cf)) return false;
  const dispari = [1, 0, 5, 7, 9, 13, 15, 17, 19, 21, 2, 4, 18, 20, 11, 3, 6, 8, 12, 14, 16, 10, 22, 25, 24, 23];
  let somma = 0;
  for (let i = 0; i < 15; i++) {
    const c = cf.charCodeAt(i);
    const n = c >= 65 ? c - 65 : c - 48;
    somma += (i % 2 === 0) ? dispari[n] : n;
  }
  return String.fromCharCode(65 + somma % 26) === cf[15];
}

    + '<div class="zoom"><span>➖</span><input type="range" id="cropZoom" min="100" max="400" value="100" oninput="crop.zoom=this.value/100;ridisegna()" aria-label="Zoom"><span>➕</span></div>'

}
function bottoniFoto(cls) {
  return '<div class="duo"><button class="btn ' + cls + '" onclick="scegliFoto(\'cam\')">📷 Scatta foto</button>'
    + '<button class="btn sec" onclick="scegliFoto(\'file\')">📎 Allega file</button></div>'
    + '<p class="note">Con "Allega file" scegli una foto già presente sul telefono o sul computer.</p>';
}
function scegliFoto(modo) { $(modo === 'cam' ? 'fotoCam' : 'fotoFile').click(); }
function fotoScelta(input) {
  const f = input.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    crop.img = img; crop.base = Math.max(196 / img.naturalWidth, 236 / img.naturalHeight);
    crop.zoom = 1; crop.x = 0; crop.y = 0;
    $('cropZoom').value = 100; $('cropArea').classList.remove('hidden'); $('cropInfo').textContent = '';
    ridisegna(); attivaDrag();
    $('cropArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  img.onerror = () => alert('Non riesco a leggere questa immagine. Prova con un\'altra foto.');
  img.src = URL.createObjectURL(f);
}
function ridisegna() {
  const cv = $('cropCanvas'); if (!cv || !crop.img) return;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 196, 236);
  const sc = crop.base * crop.zoom, w = crop.img.naturalWidth * sc, h = crop.img.naturalHeight * sc;
  const mx = Math.max(0, (w - 196) / 2), my = Math.max(0, (h - 236) / 2);
  crop.x = Math.max(-mx, Math.min(mx, crop.x)); crop.y = Math.max(-my, Math.min(my, crop.y));
  ctx.drawImage(crop.img, 98 - w / 2 + crop.x, 118 - h / 2 + crop.y, w, h);
}
function attivaDrag() {
  const cv = $('cropCanvas'); if (cv._b) return; cv._b = true;
  cv.addEventListener('pointerdown', e => { crop.drag = { x: e.clientX, y: e.clientY, px: crop.x, py: crop.y }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!crop.drag) return;
    const r = 196 / cv.getBoundingClientRect().width;
    crop.x = crop.drag.px + (e.clientX - crop.drag.x) * r; crop.y = crop.drag.py + (e.clientY - crop.drag.y) * r; ridisegna();
  });
  const fine = () => { crop.drag = null; };
  cv.addEventListener('pointerup', fine); cv.addEventListener('pointercancel', fine);
}
async function jpegSotto(canvas, max) {
  for (let q = 0.92; q >= 0.4; q -= 0.08) {
    const b = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
    if (b && b.size < max) return b;
  }
  return null;
}
async function confermaFoto() {
  const info = $('cropInfo'); info.textContent = 'Elaborazione…';
  const cv = $('cropCanvas');
  let blob = await jpegSotto(cv, 50 * 1024);
  if (!blob) {
    const small = document.createElement('canvas'); small.width = 98; small.height = 118;
    small.getContext('2d').drawImage(cv, 0, 0, 98, 118);
    blob = await jpegSotto(small, 50 * 1024);
  }
  if (!blob) { info.textContent = 'Foto troppo pesante, prova con un\'altra.'; return; }
  if (S.foto) URL.revokeObjectURL(S.foto.url);
  S.foto = { blob, url: URL.createObjectURL(blob) };

  renderFoto();
}

function htmlSlot(tipo, lato) {

  let stato, bottoni;
  if (nuovo) {
    stato = '<div class="slot-m">' + esc(nuovo.file.name) + ' — ' + (nuovo.file.size / 1024 / 1024).toFixed(1) + ' MB</div>';
    bottoni = bottoniSlot(key, 'sec') + '<button class="btn danger" onclick="togliSlot(\'' + key + '\')">Rimuovi</button>';
  } else if (es) {
    stato = '<div class="slot-m ok">✓ già inviato</div>';
    bottoni = bottoniSlot(key, 'sec') + '<button class="btn danger" onclick="rimuoviEsistente(' + Number(es.id) + ')">Rimuovi</button>';
  } else {
    stato = '<div class="slot-m">' + (lato === 'RETRO' ? 'facoltativo' : 'non caricato') + '</div>';
    bottoni = bottoniSlot(key, lato === 'RETRO' ? 'sec' : '');
  }
  return '<div class="slot">' + (nuovo ? thumbHtml(nuovo.file, nuovo.url) : '<div class="thumb">' + (es ? '✅' : '📄') + '</div>')
    + '<div class="slot-i"><div class="slot-t">' + titolo + '</div>' + stato + '</div>'
    + '<div class="slot-b">' + bottoni + '</div>'
    + '<input type="file" accept="image/*" capture="environment" id="cam_' + key + '" class="hidden" onchange="slotScelto(\'' + key + '\', this)">'
    + '<input type="file" accept="' + ACCEPT_DOC + '" id="in_' + key + '" class="hidden" onchange="slotScelto(\'' + key + '\', this)"></div>';
}
// "Scatta" apre direttamente la fotocamera posteriore; "Allega" sceglie un
// file già presente (foto, scansione o PDF).
function bottoniSlot(key, cls) {
  return '<button class="btn ' + cls + '" onclick="scegliSlot(\'' + key + '\', \'cam\')">📷 Scatta</button>'
    + '<button class="btn sec" onclick="scegliSlot(\'' + key + '\', \'file\')">📎 Allega</button>';
}
function scegliSlot(key, modo) { $((modo === 'cam' ? 'cam_' : 'in_') + key).click(); }

// Le foto dei documenti scattate col telefono possono pesare molto: le
// riduciamo (lato lungo max 2000 px, JPG) prima dell'invio.
async function preparaFile(file) {
  const tipo = (file.type || '').toLowerCase();
  if (!['image/jpeg', 'image/png', 'application/pdf'].includes(tipo)) {
    if (tipo.startsWith('image/')) { const r = await riduciImmagine(file); if (r) return r; }
    throw new Error('Formato non ammesso: usa JPG, PNG o PDF.');
  }
  if (tipo !== 'application/pdf' && file.size > 1.5 * 1024 * 1024) { const r = await riduciImmagine(file); if (r && r.size < file.size) return r; }
  if (file.size > MAX_BYTES) throw new Error('Il file supera i 10 MB.');
  return file;
}
function riduciImmagine(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => resolve(b ? new File([b], 'documento.jpg', { type: 'image/jpeg' }) : null), 'image/jpeg', 0.85);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => resolve(null);
    img.src = URL.createObjectURL(file);
  });
}
function limiteRaggiunto(sostituisce) {
  const max = (S.info.limiti && S.info.limiti.max_file) || 15;
  if (contaFile() + (sostituisce ? 0 : 1) > max) { alert('Puoi inviare al massimo ' + max + ' file.'); return true; }
  return false;
}
async function slotScelto(key, input) {
  const f = input.files[0]; if (!f) return;
  const [t, l] = key.split('|');
  if (limiteRaggiunto(!!S.slot[key] || !!esistenteSlot(t, l))) return;
  try {
    const file = await preparaFile(f);
    if (S.slot[key] && S.slot[key].url) URL.revokeObjectURL(S.slot[key].url);
    S.slot[key] = { file, url: file.type !== 'application/pdf' ? URL.createObjectURL(file) : null };
    S.caricati.delete(key);
  } catch (e) { alert(e.message); }
  renderDocumenti();
}
function togliSlot(key) { if (S.slot[key] && S.slot[key].url) URL.revokeObjectURL(S.slot[key].url); delete S.slot[key]; renderDocumenti(); }
async function aggiungiAttestato(input) {
  const f = input.files[0]; if (!f) return;
  if (limiteRaggiunto(false)) return;
  try {
    const file = await preparaFile(f);
    S.attestati.push({
      key: 'ATT' + Date.now(), tipo: $('attTipo').value, descrizione: $('attDesc').value.trim().slice(0, 150),
      scadenza: $('attScad').value || null, file, url: file.type !== 'application/pdf' ? URL.createObjectURL(file) : null,
    });
  } catch (e) { alert(e.message); }
  renderDocumenti();
}
function scegliAttestato(modo) {
  if (!$('attDesc').value.trim()) { alert('Scrivi prima una descrizione.'); $('attDesc').focus(); return; }
  $(modo === 'cam' ? 'attCam' : 'attFile').click();
}
function rimuoviAttestato(key) { S.attestati = S.attestati.filter(a => a.key !== key); renderDocumenti(); }
async function rimuoviEsistente(id) {
  if (!confirm('Rimuovere questo file già inviato?')) return;
  try {
    await chiama('doc_rimuovi', { id });
    S.esistenti = S.esistenti.filter(d => d.id !== id);
  } catch (e) {
    if (e instanceof ErroreLink) return schermataErroreLink(e.message);
    alert(e.message);
  }
  if (S.passo === 'foto') renderFoto(); else renderDocumenti();
}

// ---------------- passo 5: riepilogo e invio ----------------
function modifiche() { return CAMPI.filter(([k]) => norm(S.dati[k]) !== norm(S.orig[k])).map(([k]) => k); }
function dpiCompilati() { return Object.keys(S.dpi).filter(id => S.dpi[id].ha !== null); }
function renderRiepilogo(errore) {
  const mod = modifiche();
  const dpi = dpiCompilati();
  const senzaTaglia = dpi.filter(id => {
    const capo = (S.info.catalogo || []).find(c => String(c.id) === String(id));
    return capo && S.dpi[id].ha && (TAGLIE[capo.tipo_taglia] || []).length && !S.dpi[id].taglia;
  });
  const nuoviDoc = Object.keys(S.slot).filter(k => S.slot[k]).length + S.attestati.length;
  let html = '<h1>Riepilogo</h1><p>Controlla cosa stai per inviare. Un incaricato della Sezione verificherà i dati prima di aggiornarli.</p>';
  if (errore) html += '<div class="msg err">' + esc(errore) + '</div>';
  html += '<div class="card"><ul class="sum">';
  html += '<li><strong>Dati personali:</strong> ' + (mod.length ? mod.length + ' modifiche' : 'nessuna modifica') + '</li>';
  if (mod.length) {
    html += '<ul>' + mod.map(k => '<li><span class="k">' + esc(LABEL[k]) + ':</span> ' + esc(k === 'data_nascita' ? fmtData(S.dati[k]) : S.dati[k]) + '</li>').join('') + '</ul>';
  }
  html += '<li><strong>Taglie e DPI:</strong> ' + dpi.length + ' capi indicati' + (senzaTaglia.length ? ' <span class="amb">(' + senzaTaglia.length + ' senza taglia)</span>' : '') + '</li>';
  html += '<li><strong>Foto:</strong> ' + (S.foto ? 'nuova foto pronta' : (fotoEsistente() ? 'già inviata' : '<span class="amb">non caricata</span>')) + '</li>';
  html += '<li><strong>Documenti:</strong> ' + (nuoviDoc ? nuoviDoc + ' nuovi file' : 'nessun nuovo file') + (S.esistenti.filter(d => d.tipo !== 'FOTO').length ? ', ' + S.esistenti.filter(d => d.tipo !== 'FOTO').length + ' già inviati' : '') + '</li>';
  html += '</ul></div>';
  html += '<h2>Informativa privacy</h2><details class="priv"><summary>Leggi l\'informativa</summary>' + INFORMATIVA_HTML + '</details>'
    + '<label class="chk"><input type="checkbox" id="priv" ' + (S.privacy ? 'checked' : '') + ' onchange="S.privacy=this.checked;aggiornaBtnInvia()"> <span>Ho letto l\'informativa e autorizzo il trattamento dei miei dati personali.</span></label>'
    + '<h2>Firma</h2><p class="note">Firma con il dito qui sotto: la firma serve ad autorizzare il trattamento dei tuoi dati personali.</p>'
    + '<div id="firmaBox"></div>'
    + '<div id="stato"></div>';
  $('app').innerHTML = html;
  const i = PASSI.findIndex(p => p.id === 'riepilogo');
  setNav('<button class="btn sec" onclick="vai(\'' + PASSI[i - 1].id + '\')">← Indietro</button>'
    + '<button class="btn" id="btnInvia" onclick="invia()" disabled>Invia</button>');
  renderFirma();
}

// ---------------- firma ----------------
function firmaEsistente() { return S.esistenti.find(d => d.tipo === 'FIRMA'); }
function firmaPresente() { return !!S.firma || !!firmaEsistente(); }
function aggiornaBtnInvia() { const b = $('btnInvia'); if (b && !S.inviando) b.disabled = !(S.privacy && firmaPresente()); }

function renderFirma() {
  const box = $('firmaBox'); if (!box) return;
  if (S.firma) {
    box.innerHTML = '<img class="firma-img" src="' + S.firma.url + '" alt="la tua firma">'
      + '<div class="slot-m ok">✓ Firma pronta</div>'
      + '<button class="btn sec small" onclick="rifaiFirma()">Rifai la firma</button>';
  } else if (firmaEsistente()) {
    box.innerHTML = '<div class="msg ok">✓ Hai già firmato con l\'invio precedente.</div>'
      + '<button class="btn sec small" onclick="rifaiFirma(true)">Firma di nuovo</button>';
  } else {
    box.innerHTML = '<div class="firma-wrap"><canvas id="firmaCanvas"></canvas><div class="firma-linea"></div><div class="firma-ph" id="firmaPh">firma qui</div></div>'
      + '<div class="duo"><button class="btn sec" onclick="pulisciFirma()">Cancella</button>'
      + '<button class="btn" onclick="confermaFirma()">Conferma firma</button></div>';
    attivaFirma();
  }
  aggiornaBtnInvia();
}

const firmaPad = { punti: 0, ultimo: null };
function attivaFirma() {
  const cv = $('firmaCanvas');
  cv.width = 900; cv.height = 300; // risoluzione interna fissa, proporzione 3:1 come il riquadro
  const ctx = cv.getContext('2d');
  ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
  firmaPad.punti = 0; firmaPad.ultimo = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) }; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    firmaPad.ultimo = pos(e);
    ctx.beginPath(); ctx.arc(firmaPad.ultimo.x, firmaPad.ultimo.y, 2, 0, Math.PI * 2); ctx.fill();
    const ph = $('firmaPh'); if (ph) ph.classList.add('hidden');
  });
  cv.addEventListener('pointermove', e => {
    if (!firmaPad.ultimo) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(firmaPad.ultimo.x, firmaPad.ultimo.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    firmaPad.ultimo = p; firmaPad.punti++;
  });
  const fine = () => { firmaPad.ultimo = null; };
  cv.addEventListener('pointerup', fine); cv.addEventListener('pointercancel', fine);
}
function pulisciFirma() {
  const cv = $('firmaCanvas'); if (!cv) return;
  cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  firmaPad.punti = 0;
  const ph = $('firmaPh'); if (ph) ph.classList.remove('hidden');
}
function confermaFirma() {
  const cv = $('firmaCanvas'); if (!cv) return;
  if (firmaPad.punti < 15) { alert('Firma nel riquadro prima di confermare.'); return; }
  // PNG 600×200, sfondo bianco e inchiostro scuro
  const out = document.createElement('canvas'); out.width = 600; out.height = 200;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 600, 200);
  ctx.drawImage(cv, 0, 0, 600, 200);
  out.toBlob(b => {
    if (!b) { alert('Non è stato possibile salvare la firma, riprova.'); return; }
    if (S.firma) URL.revokeObjectURL(S.firma.url);
    S.firma = { blob: b, url: URL.createObjectURL(b) };
    S.caricati.delete('FIRMA');
    renderFirma();
  }, 'image/png');
}
function rifaiFirma(daEsistente) {
  if (S.firma) { URL.revokeObjectURL(S.firma.url); S.firma = null; }
  // La firma già inviata verrà sostituita da quella nuova al prossimo invio
  if (daEsistente) S.esistenti = S.esistenti.filter(d => d.tipo !== 'FIRMA');
  renderFirma();
}

async function invia() {
  if (S.inviando || !S.privacy) return;
  if (!firmaPresente()) { alert('Firma nel riquadro e premi "Conferma firma".'); return; }
  S.inviando = true;
  const btn = $('btnInvia'); btn.disabled = true; btn.textContent = 'Invio…';
  const stato = $('stato');
  const mostra = t => { stato.innerHTML = '<div class="msg info">' + esc(t) + '</div>'; };
  try {
    mostra('Invio dei dati…');
    const dati = {};
    CAMPI.forEach(([k]) => { dati[k] = norm(S.dati[k]) || null; });
    const dpi = dpiCompilati().map(id => ({ dpi_id: Number(id), ha: S.dpi[id].ha, taglia: S.dpi[id].ha ? (S.dpi[id].taglia || null) : null }));
    await chiama('invia', { dati, dpi, privacy: true });

    const coda = [];
    if (S.firma) coda.push({ key: 'FIRMA', run: () => carica('FIRMA', S.firma.blob, 'firma.png') });
    if (S.foto) coda.push({ key: 'FOTO', run: () => carica('FOTO', S.foto.blob, 'foto.jpg') });
    Object.keys(S.slot).filter(k => S.slot[k]).forEach(k => {
      const [tipo, lato] = k.split('|');
      if (tipo === 'PATENTE' && !patenteIndicata()) return;
      coda.push({ key: k, run: () => carica(tipo, S.slot[k].file, S.slot[k].file.name, lato) });
    });
    S.attestati.forEach(a => coda.push({ key: a.key, run: () => carica(a.tipo, a.file, a.file.name, a.descrizione, a.scadenza) }));

    const daFare = coda.filter(c => !S.caricati.has(c.key));
    for (let n = 0; n < daFare.length; n++) {
      mostra('Caricamento file ' + (n + 1) + ' di ' + daFare.length + '…');
      await daFare[n].run();
      S.caricati.add(daFare[n].key);
    }
    renderFatto();
  } catch (e) {
    S.inviando = false;
    if (e instanceof ErroreLink) return schermataErroreLink(e.message);
    stato.innerHTML = '<div class="msg err">' + esc(e.message) + '<br>Premi di nuovo <strong>Invia</strong> per riprovare: i file già caricati non verranno ripetuti.</div>';
    btn.disabled = false; btn.textContent = 'Riprova invio';
    return;
  }
  S.inviando = false;
}

function renderFatto() {
  S.passo = 'fatto'; setProg(); setNav('');
  const scade = S.info.scade_il ? new Date(S.info.scade_il).toLocaleDateString('it-IT') : '';
  $('app').innerHTML = '<div class="center"><div class="big-ico">✅</div><h1>Grazie, dati inviati!</h1></div>'
    + '<div class="msg ok">Un incaricato della Sezione controllerà quello che hai inviato e aggiornerà la tua scheda.</div>'
    + '<p>Se ti accorgi di un errore puoi riaprire questo stesso link e correggere' + (scade ? ', fino al <strong>' + esc(scade) + '</strong>' : '') + ', finché i dati non vengono approvati.</p>'
    + '<button class="btn sec" onclick="ricomincia()">Correggi i dati inviati</button>';
}
async function ricomincia() {
  try {
    const info = await chiama('apri');
    S.foto = null; S.slot = {}; S.attestati = []; S.caricati = new Set(); S.privacy = false; S.firma = null;
    inizializza(info);
    vai('anagrafica');
  } catch (e) {
    if (e instanceof ErroreLink) return schermataErroreLink(e.message);
    alert(e.message);
  }
}
</script>
</body>
</html>
